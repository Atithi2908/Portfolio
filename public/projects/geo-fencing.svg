<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#17120e" />
      <stop offset="50%" stop-color="#241a13" />
      <stop offset="100%" stop-color="#0e0b09" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#D4A373" />
      <stop offset="100%" stop-color="#FAEDCD" />
    </linearGradient>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#382d24" stroke-width="0.8" stroke-opacity="0.4" />
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" fill="url(#bgGrad)" />
  <rect width="800" height="450" fill="url(#grid)" />

  <!-- Geofence Polygon Mesh -->
  <polygon points="250,120 580,100 680,300 480,380 180,320" fill="none" stroke="#D4A373" stroke-width="2.5" stroke-dasharray="6,6" opacity="0.85" />
  <polygon points="250,120 580,100 680,300 480,380 180,320" fill="#D4A373" fill-opacity="0.08" />

  <!-- Polygon Nodes -->
  <circle cx="250" cy="120" r="7" fill="#D4A373" />
  <circle cx="580" cy="100" r="7" fill="#D4A373" />
  <circle cx="680" cy="300" r="7" fill="#D4A373" />
  <circle cx="480" cy="380" r="7" fill="#D4A373" />
  <circle cx="180" cy="320" r="7" fill="#D4A373" />

  <!-- GPS Pin Indicator (Inside Polygon) -->
  <g transform="translate(420, 210)">
    <circle cx="0" cy="0" r="32" fill="#D4A373" fill-opacity="0.15" />
    <circle cx="0" cy="0" r="18" fill="#D4A373" fill-opacity="0.3" />
    <circle cx="0" cy="0" r="8" fill="#D4A373" />
    <path d="M 0 0 L 0 -35" stroke="#D4A373" stroke-width="2" stroke-dasharray="3,3" />
  </g>

  <!-- Socket.IO Stream Waves -->
  <path d="M 100 225 Q 220 180 340 225 T 580 225 T 700 225" fill="none" stroke="#E6CCB2" stroke-width="1.5" opacity="0.3" />

  <!-- Text Overlay Badge -->
  <rect x="50" y="370" width="310" height="42" rx="8" fill="#120e0b" stroke="#3d332a" stroke-width="1.5" />
  <text x="70" y="396" font-family="monospace" font-size="14" font-weight="bold" fill="url(#goldGrad)">
    GPS &amp; Socket.IO Geofence Engine
  </text>
</svg>
