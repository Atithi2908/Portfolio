<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450" fill="none">
  <rect width="800" height="450" fill="#0d1117"/>
  <!-- Radial Glow -->
  <circle cx="400" cy="225" r="280" fill="url(#mon_glow)" opacity="0.3"/>
  <!-- Waveform / Telemetry Lines -->
  <path d="M50 240 Q 150 180, 250 260 T 450 160 T 650 280 T 750 220" stroke="#38bdf8" stroke-width="3" fill="none" opacity="0.8"/>
  <path d="M50 260 Q 180 300, 300 210 T 520 290 T 700 190 T 750 250" stroke="#818cf8" stroke-width="2" fill="none" opacity="0.5" stroke-dasharray="6 4"/>
  <!-- Central Queue Container -->
  <rect x="280" y="160" width="240" height="130" rx="16" fill="#161b22" stroke="#38bdf8" stroke-width="2"/>
  <text x="400" y="200" fill="#38bdf8" font-family="monospace" font-size="14" font-weight="bold" text-anchor="middle">RabbitMQ Ingestion Pipeline</text>
  <rect x="310" y="220" width="180" height="40" rx="8" fill="#0d1117" stroke="#30363d"/>
  <text x="400" y="245" fill="#e2e8f0" font-family="monospace" font-size="12" text-anchor="middle">&lt; 0.5ms SDK Latency</text>
  <!-- Status pill -->
  <rect x="290" y="360" width="220" height="36" rx="18" fill="#161b22" stroke="#30363d"/>
  <text x="400" y="383" fill="#818cf8" font-family="monospace" font-size="13" font-weight="bold" text-anchor="middle" letter-spacing="1">DISTRIBUTED TELEMETRY</text>
  <defs>
    <radialGradient id="mon_glow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(400 225) rotate(90) scale(280)">
      <stop stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
  </defs>
</svg>
