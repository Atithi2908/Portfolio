<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGradCache" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#140f0c" />
      <stop offset="50%" stop-color="#1e1712" />
      <stop offset="100%" stop-color="#0a0806" />
    </linearGradient>
    <linearGradient id="goldGradCache" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#D4A373" />
      <stop offset="100%" stop-color="#FAEDCD" />
    </linearGradient>
    <pattern id="gridCache" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#382d24" stroke-width="0.8" stroke-opacity="0.4" />
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" fill="url(#bgGradCache)" />
  <rect width="800" height="450" fill="url(#gridCache)" />

  <!-- Hash Ring Circle -->
  <circle cx="400" cy="210" r="130" fill="none" stroke="#D4A373" stroke-width="2.5" stroke-dasharray="6,6" opacity="0.75" />

  <!-- Node A (Top) -->
  <circle cx="400" cy="80" r="28" fill="#1c1611" stroke="#D4A373" stroke-width="3" />
  <text x="400" y="85" font-family="monospace" font-size="13" font-weight="bold" fill="#FAEDCD" text-anchor="middle">NODE A</text>

  <!-- Node B (Bottom Right) -->
  <circle cx="512" cy="275" r="28" fill="#1c1611" stroke="#D4A373" stroke-width="3" />
  <text x="512" y="280" font-family="monospace" font-size="13" font-weight="bold" fill="#FAEDCD" text-anchor="middle">NODE B</text>

  <!-- Node C (Bottom Left) -->
  <circle cx="288" cy="275" r="28" fill="#1c1611" stroke="#D4A373" stroke-width="3" />
  <text x="288" y="280" font-family="monospace" font-size="13" font-weight="bold" fill="#FAEDCD" text-anchor="middle">NODE C</text>

  <!-- Router Core (Center) -->
  <rect x="340" y="180" width="120" height="60" rx="10" fill="#120e0b" stroke="#D4A373" stroke-width="2" />
  <text x="400" y="215" font-family="monospace" font-size="14" font-weight="bold" fill="#D4A373" text-anchor="middle">ROUTER</text>

  <!-- Quorum Dispatch Arrows -->
  <line x1="400" y1="180" x2="400" y2="108" stroke="#D4A373" stroke-width="2" stroke-dasharray="3,3" />
  <line x1="440" y1="230" x2="490" y2="255" stroke="#D4A373" stroke-width="2" stroke-dasharray="3,3" />
  <line x1="360" y1="230" x2="310" y2="255" stroke="#D4A373" stroke-width="2" stroke-dasharray="3,3" />

  <!-- Quorum 2/3 Badge -->
  <rect x="580" y="70" width="170" height="34" rx="6" fill="#1c1611" stroke="#3d332a" />
  <text x="665" y="92" font-family="monospace" font-size="12" font-weight="bold" fill="#D4A373" text-anchor="middle">QUORUM: 2/3 WRITE</text>

  <!-- Text Overlay Badge -->
  <rect x="50" y="370" width="410" height="42" rx="8" fill="#120e0b" stroke="#3d332a" stroke-width="1.5" />
  <text x="70" y="396" font-family="monospace" font-size="14" font-weight="bold" fill="url(#goldGradCache)">
    Distributed In-Memory Cache in Go
  </text>
</svg>
